<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSync - Cadastro Rápido (Banca)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .linha {
            display: flex;
            gap: 10px;
        }

        .linha .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-group input:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        .dica {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
        }

        .camera-container {
            text-align: center;
            margin-bottom: 20px;
        }

        video,
        #fotoPreview {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #007bff;
            display: none;
            margin: 0 auto;
        }

        #fotoPreview {
            border-color: #28a745;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .btn-cam {
            background-color: #17a2b8;
        }

        .btn-cam:hover {
            background-color: #138496;
        }

        .btn-capturar {
            background-color: #ffc107;
            color: black;
        }

        .btn-submit {
            background-color: #28a745;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .oculto {
            display: none !important;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            white-space: pre-line;
        }

        .ok {
            color: green;
            font-size: 18px;
        }

        .erro {
            color: #c82333;
        }

        .aviso {
            color: #b8860b;
        }

        #avisoServidor {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>ParkSync - Cadastro de Morador</h2>
        <div id="avisoServidor" class="oculto"></div>

        <form id="formCadastro" novalidate>
            <div class="form-group"><label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required minlength="2" maxlength="100" autocomplete="name" placeholder=" ">
            </div>
            <div class="form-group"><label for="email">E-mail:</label>
                <input type="email" id="email" required maxlength="100" autocomplete="email" placeholder=" ">
            </div>
            <div class="linha">
                <div class="form-group"><label for="senha">Senha do app:</label>
                    <input type="password" id="senha" required minlength="4" autocomplete="new-password" placeholder=" ">
                    <div class="dica">Mínimo de 4 caracteres. O morador usa para entrar no app.</div>
                </div>
                <div class="form-group"><label for="senha2">Confirmar senha:</label>
                    <input type="password" id="senha2" required minlength="4" autocomplete="new-password" placeholder=" ">
                </div>
            </div>
            <div class="linha">
                <div class="form-group"><label for="apartamento">Apartamento:</label>
                    <input type="text" id="apartamento" required maxlength="50" placeholder=" ">
                </div>
                <div class="form-group"><label for="bloco">Bloco:</label>
                    <input type="text" id="bloco" required maxlength="50" placeholder=" ">
                </div>
            </div>
            <hr>
            <h2>ParkSync - Veículo vinculado</h2>
            <div class="form-group"><label for="placa">Placa do Veículo (Ex: ABC1D23):</label>
                <input type="text" id="placa" required maxlength="8" autocomplete="off" placeholder=" "
                    style="text-transform: uppercase;">
                <div class="dica">Mercosul (ABC1D23) ou modelo antigo (ABC1234). Traço e espaço são ignorados.</div>
            </div>
            <div class="form-group"><label for="marca">Marca (Ex: Ford):</label><input type="text" id="marca" maxlength="50"></div>
            <div class="form-group"><label for="modelo">Modelo (Ex: Mustang Mach):</label><input type="text" id="modelo" maxlength="50"></div>
            <div class="form-group"><label for="cor">Cor (Ex: Branco):</label><input type="text" id="cor" maxlength="30"></div>

            <div class="camera-container">
                <video id="videoElement" autoplay playsinline muted></video>
                <img id="fotoPreview" alt="Foto capturada do morador">
                <canvas id="canvasElement" class="oculto"></canvas>
                <button type="button" class="btn-cam" id="btnIniciarCam">📸 Ligar Câmera</button>
                <button type="button" class="btn-capturar oculto" id="btnCapturar">📷 Capturar Rosto</button>
                <button type="button" class="btn-cam oculto" id="btnRefazer">🔄 Tirar outra foto</button>
            </div>

            <button type="submit" class="btn-submit" id="btnSalvar">✅ Salvar e Validar Face</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO
        // Endereço da API: abra a página com ?api=http://IP_DO_PC:8000 (fica salvo no navegador).
        // Sem isso usa http://127.0.0.1:8000.
        // Se o .env tiver PORTARIA_API_KEY, abra também com ?chave=SUA_CHAVE (fica salva).
        // ==========================================
        function configSalva(param, chaveStorage) {
            let valor = new URLSearchParams(location.search).get(param);
            try {
                if (valor) localStorage.setItem(chaveStorage, valor);
                else valor = localStorage.getItem(chaveStorage);
            } catch (e) { /* navegador sem localStorage */ }
            return valor || '';
        }

        const API_BASE = (configSalva('api', 'parksync_api') ||
            (location.protocol.startsWith('http') && location.port === '8000' ? location.origin : 'http://127.0.0.1:8000')
        ).replace(/\/+$/, '');
        const PORTARIA_KEY = configSalva('chave', 'parksync_chave');

        const FOTO_LARGURA_MAX = 640;   // foto menor = upload e reconhecimento mais rápidos
        const FOTO_QUALIDADE = 0.85;
        const PADRAO_PLACA = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/; // Mercosul ou antiga

        const $ = (id) => document.getElementById(id);
        const video = $('videoElement'), canvas = $('canvasElement'), preview = $('fotoPreview');
        const btnIniciarCam = $('btnIniciarCam'), btnCapturar = $('btnCapturar'), btnRefazer = $('btnRefazer');
        const btnSalvar = $('btnSalvar'), statusEl = $('status');

        let stream = null;
        let fotoBase64 = null;

        function mostrarStatus(texto, classe) {
            statusEl.textContent = texto;   // textContent: nada vindo do servidor vira HTML
            statusEl.className = classe || '';
        }

        function mensagemErro(data, status) {
            const d = data && data.detail;
            if (Array.isArray(d)) {   // erro de validação do FastAPI (422)
                return d.map(e => {
                    const campo = Array.isArray(e.loc) ? e.loc[e.loc.length - 1] : '';
                    return `${campo}: ${String(e.msg || '').replace(/^Value error, /, '')}`;
                }).join('\n');
            }
            if (status === 403) return 'Rota da portaria: abra esta página no computador onde a API roda (127.0.0.1) ou configure ?chave=.';
            if (status === 401) return 'Chave da portaria inválida (?chave=).';
            return d || `Erro HTTP ${status}`;
        }

        async function fetchComTempo(url, opcoes = {}, ms = 30000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
                return await fetch(url, { ...opcoes, signal: ctrl.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        // Avisa logo de cara se o servidor está fora ou sem reconhecimento facial
        async function verificarServidor() {
            const aviso = $('avisoServidor');
            try {
                const res = await fetchComTempo(`${API_BASE}/`, {}, 5000);
                const s = await res.json();
                if (!s.reconhecimento_facial) {
                    aviso.textContent = '⚠️ O servidor está sem reconhecimento facial (face_recognition/dlib). O cadastro vai falhar até instalar.';
                    aviso.classList.remove('oculto');
                } else {
                    aviso.classList.add('oculto');
                }
            } catch (e) {
                aviso.textContent = `⚠️ Não consegui falar com a API em ${API_BASE}. Ligue o backend (python main.py) ou abra com ?api=http://IP:8000.`;
                aviso.classList.remove('oculto');
            }
        }

        // ==========================================
        // CÂMERA
        // ==========================================
        function pararCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null;
            video.srcObject = null;
            video.style.display = 'none';
        }

        async function iniciarCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                mostrarStatus('Este navegador não libera a câmera aqui. Abra pelo Chrome/Edge em http://localhost ou direto do arquivo.', 'erro');
                return;
            }
            btnIniciarCam.disabled = true;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
                });
                video.srcObject = stream;
                video.style.display = 'block';
                preview.style.display = 'none';
                btnIniciarCam.classList.add('oculto');
                btnRefazer.classList.add('oculto');
                btnCapturar.classList.remove('oculto');
                mostrarStatus('');
            } catch (e) {
                const msg = e.name === 'NotAllowedError' ? 'Permissão da câmera negada.'
                    : e.name === 'NotFoundError' ? 'Nenhuma câmera encontrada.'
                        : e.name === 'NotReadableError' ? 'A câmera está em uso por outro programa (a API usa a webcam do FACE_CAM?).'
                            : `Erro ao abrir a câmera: ${e.message}`;
                mostrarStatus(msg, 'erro');
            } finally {
                btnIniciarCam.disabled = false;
            }
        }

        // Brilho médio da foto (0-255): pega foto preta/tampada antes de mandar ao servidor
        function brilhoMedio(ctx, w, h) {
            const dados = ctx.getImageData(0, 0, w, h).data;
            let soma = 0, n = 0;
            for (let i = 0; i < dados.length; i += 4 * 16) {   // amostra 1 a cada 16 pixels
                soma += dados[i] * 0.299 + dados[i + 1] * 0.587 + dados[i + 2] * 0.114;
                n++;
            }
            return n ? soma / n : 0;
        }

        function capturarFoto() {
            if (!video.videoWidth) {
                mostrarStatus('A câmera ainda está iniciando. Tente de novo em um segundo.', 'aviso');
                return;
            }
            const escala = Math.min(1, FOTO_LARGURA_MAX / video.videoWidth);
            canvas.width = Math.round(video.videoWidth * escala);
            canvas.height = Math.round(video.videoHeight * escala);
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const brilho = brilhoMedio(ctx, canvas.width, canvas.height);
            if (brilho < 25) {
                mostrarStatus('Foto muito escura. Acenda a luz ou destampe a câmera e capture de novo.', 'erro');
                return;
            }
            if (brilho > 235) {
                mostrarStatus('Foto estourada (muito clara). Ajuste a luz e capture de novo.', 'erro');
                return;
            }

            fotoBase64 = canvas.toDataURL('image/jpeg', FOTO_QUALIDADE);
            preview.src = fotoBase64;
            preview.style.display = 'block';
            pararCamera();   // libera a webcam (a API pode precisar dela)
            btnCapturar.classList.add('oculto');
            btnRefazer.classList.remove('oculto');
            mostrarStatus('Foto capturada! Confira se o rosto está de frente e salve.', 'ok');
        }

        // ==========================================
        // VALIDAÇÃO E ENVIO
        // ==========================================
        function lerFormulario() {
            const valor = (id) => $(id).value.trim();
            const placa = valor('placa').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const erros = [];

            ['nome', 'email', 'senha', 'apartamento', 'bloco'].forEach(id => {
                if (!$(id).checkValidity()) erros.push(`${$(id).labels[0].textContent.replace(':', '')} inválido ou vazio.`);
            });
            if ($('senha').value !== $('senha2').value) erros.push('As senhas não conferem.');
            if (!PADRAO_PLACA.test(placa)) erros.push('Placa inválida. Use ABC1D23 ou ABC1234.');
            if (!fotoBase64) erros.push('Capture a foto do rosto antes de salvar.');

            return {
                erros,
                payload: {
                    nome: valor('nome'),
                    email: valor('email').toLowerCase(),
                    senha: $('senha').value,
                    apartamento: valor('apartamento'),
                    bloco: valor('bloco').toUpperCase(),
                    placa,
                    marca: valor('marca') || 'Não informada',
                    modelo: valor('modelo') || 'Não informado',
                    cor: valor('cor') || 'Não informada',
                    foto_base64: fotoBase64,
                }
            };
        }

        function limparFormulario() {
            $('formCadastro').reset();
            fotoBase64 = null;
            preview.removeAttribute('src');
            preview.style.display = 'none';
            btnRefazer.classList.add('oculto');
            btnCapturar.classList.add('oculto');
            btnIniciarCam.classList.remove('oculto');
        }

        async function enviarCadastro(evento) {
            evento.preventDefault();
            const { erros, payload } = lerFormulario();
            if (erros.length) {
                mostrarStatus('❌ ' + erros.join('\n'), 'erro');
                return;
            }

            btnSalvar.disabled = true;
            btnSalvar.textContent = 'Salvando e validando face...';
            mostrarStatus('');

            const headers = { 'Content-Type': 'application/json' };
            if (PORTARIA_KEY) headers['X-Portaria-Key'] = PORTARIA_KEY;

            try {
                const res = await fetchComTempo(`${API_BASE}/api/morador/cadastro`, {
                    method: 'POST', headers, body: JSON.stringify(payload)
                }, 60000);
                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    mostrarStatus(`✅ Sucesso! ${payload.nome} registrado (ID: ${data.id}). Vaga ${payload.apartamento}${payload.bloco}.`, 'ok');
                    limparFormulario();
                } else {
                    mostrarStatus('❌ Erro: ' + mensagemErro(data, res.status), 'erro');
                }
            } catch (e) {
                mostrarStatus(e.name === 'AbortError'
                    ? '❌ O servidor demorou demais para responder. Tente de novo.'
                    : `❌ Erro de conexão com o servidor (${API_BASE}). O backend está ligado?`, 'erro');
            } finally {
                btnSalvar.textContent = '✅ Salvar e Validar Face';
                btnSalvar.disabled = false;
            }
        }

        btnIniciarCam.addEventListener('click', iniciarCamera);
        btnCapturar.addEventListener('click', capturarFoto);
        btnRefazer.addEventListener('click', () => { fotoBase64 = null; iniciarCamera(); });
        $('formCadastro').addEventListener('submit', enviarCadastro);
        $('placa').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });
        window.addEventListener('beforeunload', pararCamera);
        verificarServidor();
    </script>
</body>

</html>
